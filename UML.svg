<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
<defs>
<style>
.title{font:700 30px Arial;fill:#172033}.sub{font:14px Arial;fill:#526071}.name{font:700 18px Arial;fill:#fff}.stereo{font:italic 13px Arial;fill:#dbeafe}.body{font:14px monospace;fill:#172033}.label{font:13px Arial;fill:#334155}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.head{fill:#2563eb}.abstract{fill:#6d28d9}.interface{fill:#047857}.enum{fill:#b45309}.line{stroke:#475569;stroke-width:2;fill:none}.dash{stroke:#475569;stroke-width:2;fill:none;stroke-dasharray:8 6}
</style>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#475569"/></marker>
<marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M1,1 L13,7 L1,13 z" fill="white" stroke="#475569" stroke-width="1.5"/></marker>
<marker id="diamond" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto"><path d="M1,7 L7,1 L13,7 L7,13 z" fill="#475569"/></marker>
</defs>
<rect width="1800" height="1250" fill="#eef2f7"/>
<text x="900" y="45" text-anchor="middle" class="title">Airport Operations and Disruption Recovery System</text>
<text x="900" y="70" text-anchor="middle" class="sub">UML Class Diagram — core domain and service architecture</text>

<!-- management system -->
<g transform="translate(520 95)"><rect class="box" width="760" height="180" rx="8"/><rect class="head" width="760" height="42" rx="8"/><text x="380" y="27" text-anchor="middle" class="name">AirportManagementSystem</text><line x1="0" y1="42" x2="760" y2="42" class="line"/>
<text x="14" y="65" class="body">- airports: List&lt;Airport&gt;       - flights: List&lt;Flight&gt;</text><text x="14" y="86" class="body">- passengers: List&lt;Passenger&gt;   - bookings: List&lt;Booking&gt;</text><text x="14" y="107" class="body">- gates: List&lt;Gate&gt;             - baggage: List&lt;Baggage&gt;</text><line x1="0" y1="119" x2="760" y2="119" class="line"/>
<text x="14" y="143" class="body">+ add/find/remove operations()   + getSystemSummary(): String</text><text x="14" y="165" class="body">+ registry counts/capacity()     + getTrackableItems(): List&lt;Trackable&gt;</text></g>

<!-- airport -->
<g transform="translate(45 335)"><rect class="box" width="330" height="205" rx="8"/><rect class="head" width="330" height="42" rx="8"/><text x="165" y="27" text-anchor="middle" class="name">Airport</text><line x1="0" y1="42" x2="330" y2="42" class="line"/>
<text x="12" y="66" class="body">- airportCode: String</text><text x="12" y="87" class="body">- name/city/country: String</text><text x="12" y="108" class="body">- arrivals/departures: int</text><line x1="0" y1="120" x2="330" y2="120" class="line"/><text x="12" y="144" class="body">+ recordArrival(): void</text><text x="12" y="165" class="body">+ recordDeparture(): void</text><text x="12" y="186" class="body">+ calculateDailyTraffic(): int</text></g>

<!-- flight -->
<g transform="translate(465 335)"><rect class="box" width="440" height="315" rx="8"/><rect class="abstract" width="440" height="58" rx="8"/><text x="220" y="20" text-anchor="middle" class="stereo">«abstract»</text><text x="220" y="44" text-anchor="middle" class="name">Flight</text><line x1="0" y1="58" x2="440" y2="58" class="line"/>
<text x="12" y="82" class="body">- flightNumber/origin/destination: String</text><text x="12" y="103" class="body">- departureTime/arrivalTime: LocalDateTime</text><text x="12" y="124" class="body">- capacity: int</text><text x="12" y="145" class="body">- status: FlightStatus</text><text x="12" y="166" class="body">- passengers/standbyQueue/reservedSeats</text><text x="12" y="187" class="body">- assignedGate: Gate</text><line x1="0" y1="199" x2="440" y2="199" class="line"/>
<text x="12" y="223" class="body">+ add/removePassenger(): void</text><text x="12" y="244" class="body">+ promoteStandbyPassenger(): Passenger</text><text x="12" y="265" class="body">+ delay/cancel/open/close/depart/arrive(): void</text><text x="12" y="286" class="body">+ calculateTravelFee(baseFare): double {abstract}</text><text x="12" y="307" class="body">+ validateTravelDocuments(Passenger) {abstract}</text></g>

<!-- Trackable -->
<g transform="translate(1370 105)"><rect class="box" width="370" height="150" rx="8"/><rect class="interface" width="370" height="58" rx="8"/><text x="185" y="20" text-anchor="middle" class="stereo">«interface»</text><text x="185" y="44" text-anchor="middle" class="name">Trackable</text><line x1="0" y1="58" x2="370" y2="58" class="line"/><text x="12" y="84" class="body">+ getCurrentStatus(): String</text><text x="12" y="106" class="body">+ updateStatus(String): void</text><text x="12" y="128" class="body">+ getTrackingSummary(): String</text></g>

<!-- passenger -->
<g transform="translate(1000 335)"><rect class="box" width="350" height="245" rx="8"/><rect class="head" width="350" height="42" rx="8"/><text x="175" y="27" text-anchor="middle" class="name">Passenger</text><line x1="0" y1="42" x2="350" y2="42" class="line"/><text x="12" y="66" class="body">- passengerId/name: String</text><text x="12" y="87" class="body">- passport/governmentId/visa: String</text><text x="12" y="108" class="body">- bookings: List&lt;Booking&gt;</text><text x="12" y="129" class="body">- baggage: List&lt;Baggage&gt;</text><line x1="0" y1="141" x2="350" y2="141" class="line"/><text x="12" y="165" class="body">+ requestBooking(Flight): void</text><text x="12" y="186" class="body">+ add/cancelBooking(Booking): void</text><text x="12" y="207" class="body">+ checkInBaggage(Baggage): void</text><text x="12" y="228" class="body">+ viewItinerary(): String</text></g>

<!-- booking -->
<g transform="translate(1415 335)"><rect class="box" width="340" height="270" rx="8"/><rect class="head" width="340" height="42" rx="8"/><text x="170" y="27" text-anchor="middle" class="name">Booking</text><line x1="0" y1="42" x2="340" y2="42" class="line"/><text x="12" y="66" class="body">- confirmationNumber: String</text><text x="12" y="87" class="body">- passenger: Passenger</text><text x="12" y="108" class="body">- flight: Flight</text><text x="12" y="129" class="body">- seatNumber: String</text><text x="12" y="150" class="body">- baseFare/totalFare: double</text><text x="12" y="171" class="body">- status: BookingStatus</text><line x1="0" y1="183" x2="340" y2="183" class="line"/><text x="12" y="207" class="body">+ confirm/cancel/checkIn/board(): void</text><text x="12" y="228" class="body">+ moveToStandby/changeSeat(): void</text><text x="12" y="249" class="body">+ markRebooked(Flight): void</text></g>

<!-- subclasses -->
<g transform="translate(390 765)"><rect class="box" width="360" height="215" rx="8"/><rect class="head" width="360" height="42" rx="8"/><text x="180" y="27" text-anchor="middle" class="name">DomesticFlight</text><line x1="0" y1="42" x2="360" y2="42" class="line"/><text x="12" y="66" class="body">- domesticTaxRate: double</text><text x="12" y="87" class="body">- residentDiscountAvailable: boolean</text><line x1="0" y1="99" x2="360" y2="99" class="line"/><text x="12" y="123" class="body">+ validateGovernmentId(Passenger): void</text><text x="12" y="144" class="body">+ calculateDomesticTax(double): double</text><text x="12" y="165" class="body">+ applyResidentDiscount(double): double</text><text x="12" y="186" class="body">+ determineBoardingGroup(int): int</text><text x="12" y="207" class="body">+ getRequiredArrivalMinutes(): int</text></g>
<g transform="translate(780 765)"><rect class="box" width="390" height="215" rx="8"/><rect class="head" width="390" height="42" rx="8"/><text x="195" y="27" text-anchor="middle" class="name">InternationalFlight</text><line x1="0" y1="42" x2="390" y2="42" class="line"/><text x="12" y="66" class="body">- internationalTaxRate: double</text><text x="12" y="87" class="body">- customsRequirements: List&lt;String&gt;</text><line x1="0" y1="99" x2="390" y2="99" class="line"/><text x="12" y="123" class="body">+ validatePassport(Passenger): void</text><text x="12" y="144" class="body">+ validateVisaRequirement(Passenger): void</text><text x="12" y="165" class="body">+ calculateInternationalTax(double): double</text><text x="12" y="186" class="body">+ determineInternationalCheckInDeadline()</text><text x="12" y="207" class="body">+ getRequiredArrivalMinutes(): int</text></g>

<!-- gate -->
<g transform="translate(45 765)"><rect class="box" width="300" height="240" rx="8"/><rect class="head" width="300" height="42" rx="8"/><text x="150" y="27" text-anchor="middle" class="name">Gate</text><line x1="0" y1="42" x2="300" y2="42" class="line"/><text x="12" y="66" class="body">- gateNumber: String</text><text x="12" y="87" class="body">- assignedFlight: Flight</text><text x="12" y="108" class="body">- available: boolean</text><text x="12" y="129" class="body">- internationalCapable: boolean</text><text x="12" y="150" class="body">- maximumPassengerCapacity: int</text><line x1="0" y1="162" x2="300" y2="162" class="line"/><text x="12" y="186" class="body">+ canAcceptFlight(Flight): boolean</text><text x="12" y="207" class="body">+ assign/releaseFlight(): void</text><text x="12" y="228" class="body">+ markTemporarilyUnavailable(): void</text></g>

<!-- baggage -->
<g transform="translate(1240 735)"><rect class="box" width="410" height="290" rx="8"/><rect class="head" width="410" height="42" rx="8"/><text x="205" y="27" text-anchor="middle" class="name">Baggage</text><line x1="0" y1="42" x2="410" y2="42" class="line"/><text x="12" y="66" class="body">- tagNumber: String</text><text x="12" y="87" class="body">- owner: Passenger</text><text x="12" y="108" class="body">- weight: double</text><text x="12" y="129" class="body">- status: BaggageStatus</text><text x="12" y="150" class="body">- assignedFlight: Flight</text><text x="12" y="171" class="body">- currentLocation: String</text><line x1="0" y1="183" x2="410" y2="183" class="line"/><text x="12" y="207" class="body">+ checkIn/assign/load/transfer(): void</text><text x="12" y="228" class="body">+ markMisrouted/ReadyForClaim/Claimed(): void</text><text x="12" y="249" class="body">+ updateLocation(String): void</text><text x="12" y="270" class="body">+ getTrackingSummary(): String</text></g>

<!-- enums -->
<g transform="translate(90 1080)"><rect class="box" width="350" height="110" rx="8"/><rect class="enum" width="350" height="50" rx="8"/><text x="175" y="18" text-anchor="middle" class="stereo">«enumeration»</text><text x="175" y="40" text-anchor="middle" class="name">FlightStatus</text><text x="12" y="75" class="body">SCHEDULED, DELAYED, BOARDING, CLOSED,</text><text x="12" y="96" class="body">DEPARTED, ARRIVED, CANCELED</text></g>
<g transform="translate(540 1080)"><rect class="box" width="340" height="110" rx="8"/><rect class="enum" width="340" height="50" rx="8"/><text x="170" y="18" text-anchor="middle" class="stereo">«enumeration»</text><text x="170" y="40" text-anchor="middle" class="name">BookingStatus</text><text x="12" y="75" class="body">PENDING, CONFIRMED, STANDBY,</text><text x="12" y="96" class="body">CHECKED_IN, BOARDED, CANCELED, REBOOKED</text></g>
<g transform="translate(980 1080)"><rect class="box" width="500" height="110" rx="8"/><rect class="enum" width="500" height="50" rx="8"/><text x="250" y="18" text-anchor="middle" class="stereo">«enumeration»</text><text x="250" y="40" text-anchor="middle" class="name">BaggageStatus</text><text x="12" y="75" class="body">CREATED, CHECKED_IN, LOADED, IN_TRANSIT, TRANSFERRED,</text><text x="12" y="96" class="body">MISROUTED, READY_FOR_CLAIM, CLAIMED</text></g>

<!-- relationships -->
<path d="M900 275 L900 305 L210 305 L210 335" class="line" marker-start="url(#diamond)"/><text x="235" y="299" class="label">0..100 airports</text>
<path d="M900 275 L900 335" class="line" marker-start="url(#diamond)"/><text x="910" y="315" class="label">0..100 flights</text>
<path d="M1000 275 L1000 310 L1175 310 L1175 335" class="line" marker-start="url(#diamond)"/><text x="1040" y="304" class="label">0..100 passengers</text>
<path d="M1100 275 L1100 295 L1585 295 L1585 335" class="line" marker-start="url(#diamond)"/><text x="1370" y="289" class="label">0..100 bookings</text>
<path d="M685 765 L685 650" class="line" marker-end="url(#triangle)"/><path d="M975 765 L975 700 L700 700 L700 650" class="line" marker-end="url(#triangle)"/>
<path d="M905 430 L1000 430" class="line" marker-end="url(#arrow)"/><text x="920" y="422" class="label">passengers</text>
<path d="M1415 455 L1350 455" class="line" marker-end="url(#arrow)"/><text x="1360" y="447" class="label">passenger</text>
<path d="M1415 500 L905 500" class="line" marker-end="url(#arrow)"/><text x="1130" y="492" class="label">flight</text>
<path d="M345 855 L430 855 L430 620 L465 620" class="line" marker-end="url(#arrow)"/><text x="350" y="845" class="label">assigned flight</text>
<path d="M1240 835 L1175 835 L1175 580" class="line" marker-end="url(#arrow)"/><text x="1183" y="820" class="label">owner</text>
<path d="M1240 900 L1200 900 L1200 680 L905 680 L905 620" class="line" marker-end="url(#arrow)"/><text x="1030" y="674" class="label">assigned flight</text>
<path d="M905 365 L1325 365 L1325 255 L1370 255" class="dash" marker-end="url(#triangle)"/><text x="1190" y="350" class="label">implements</text>
<path d="M1445 735 L1445 650 L1710 650 L1710 255" class="dash" marker-end="url(#triangle)"/><text x="1460" y="644" class="label">implements</text>
<path d="M560 650 L560 1080" class="dash" marker-end="url(#arrow)"/><path d="M1500 605 L1500 1045 L710 1045 L710 1080" class="dash" marker-end="url(#arrow)"/><path d="M1445 1025 L1445 1080" class="dash" marker-end="url(#arrow)"/>
<text x="1530" y="1215" class="sub">Legend: solid diamond = ownership · hollow triangle = inheritance/implementation · arrow = association</text>
</svg>